<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Populated from CONFIG by app.js; static fallbacks below for crawlers that skip JS -->
  <title>Chandra Sailesh — AI Engineer & Developer</title>
  <meta name="description" content="Personal portfolio of Chandra Sailesh — AI Engineer building intelligent systems, ML pipelines, and seamless web experiences." />
  <meta name="keywords" content="AI Engineer, Machine Learning, Full Stack Developer, Portfolio" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Chandra Sailesh — AI Engineer & Developer" />
  <meta property="og:description" content="AI Engineer building intelligent systems, ML pipelines, and seamless web experiences." />
  <meta name="theme-color" content="#07070c" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23a78bfa'/%3E%3Cstop%20offset='1'%20stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23090912'/%3E%3Ctext%20x='32'%20y='43'%20font-family='Arial,sans-serif'%20font-size='26'%20font-weight='700'%20fill='url(%23g)'%20text-anchor='middle'%3ECS%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient background layers: gradient mesh (CSS) + neural graph (canvas) -->
  <div class="bg-mesh" aria-hidden="true"></div>
  <canvas id="neural-bg" aria-hidden="true"></canvas>

  <nav class="nav" id="nav">
    <div class="nav__inner container">
      <a class="nav__logo" href="#top" aria-label="Home">CS<span class="nav__logo-dot">.</span></a>
      <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span>
      </button>
      <ul class="nav__links" id="nav-links"></ul>
    </div>
  </nav>

  <main id="top">
    <header class="hero container" id="hero">
      <p class="hero__eyebrow mono reveal" data-reveal>// available for interesting problems</p>
      <h1 class="hero__name reveal" data-reveal></h1>
      <p class="hero__subtitle reveal" data-reveal></p>
      <p class="hero__bio reveal" data-reveal></p>
      <div class="hero__cta reveal" data-reveal id="hero-cta"></div>
      <ul class="hero__socials reveal" data-reveal id="hero-socials"></ul>
    </header>

    <section class="section container" id="experience" style="--section-accent: #a78bfa">
      <div class="section__head">
        <span class="section__index mono reveal" data-reveal></span>
        <h2 class="section__title reveal" data-reveal></h2>
        <p class="section__desc reveal" data-reveal></p>
      </div>
      <ol class="timeline" id="experience-list"></ol>
    </section>

    <section class="section container" id="projects" style="--section-accent: #22d3ee">
      <div class="section__head">
        <span class="section__index mono reveal" data-reveal></span>
        <h2 class="section__title reveal" data-reveal></h2>
        <p class="section__desc reveal" data-reveal></p>
      </div>
      <div class="filters reveal" data-reveal id="project-filters" role="tablist" aria-label="Filter projects"></div>
      <div class="grid grid--cards" id="projects-grid"></div>
    </section>

    <section class="section container" id="research" style="--section-accent: #f472b6" hidden>
      <div class="section__head">
        <span class="section__index mono reveal" data-reveal></span>
        <h2 class="section__title reveal" data-reveal></h2>
        <p class="section__desc reveal" data-reveal></p>
      </div>
      <div class="grid grid--cards" id="research-grid"></div>
    </section>

    <section class="section container" id="writing" style="--section-accent: #34d399">
      <div class="section__head">
        <span class="section__index mono reveal" data-reveal></span>
        <h2 class="section__title reveal" data-reveal></h2>
        <p class="section__desc reveal" data-reveal></p>
      </div>
      <div class="writing glass reveal" data-reveal>
        <ul class="writing__list" id="writing-list"></ul>
        <a class="btn btn--ghost writing__more" id="writing-link" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </section>

    <section class="section container section--contact" id="contact" style="--section-accent: #a78bfa">
      <div class="section__head section__head--center">
        <h2 class="section__title reveal" data-reveal>Get in touch</h2>
        <p class="section__desc reveal" data-reveal>Have an idea worth building? My inbox is open.</p>
      </div>
      <div class="contact-cards reveal" data-reveal id="contact-cards"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__text" id="footer-text"></p>
      <a class="footer__top" href="#top" aria-label="Back to top">&uarr;</a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
